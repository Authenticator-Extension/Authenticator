name: CI

on: [push, pull_request]

jobs:
  style:
    runs-on: ubuntu-latest
    name: Style checks

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm i prettier

      - name: Prettier
        run: ./node_modules/.bin/prettier --check ./src/* ./src/**/* ./src/**/**/* ./sass/*.scss

      - name: Check cloud permissions
        run: node scripts/check-cloud-permissions.js

      - name: Check local-only files are not tracked
        run: |
          tracked="$(git ls-files -- docs AGENTS.md CLAUDE.md)"
          if [ -n "$tracked" ]; then
            echo "::error::Local-only files must not be committed:"
            echo "$tracked"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.platform }}

    strategy:
      matrix:
        platform: ["chrome", "firefox"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.platform }}
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [build]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test code
        run: xvfb-run --auto-servernum -- npm test
