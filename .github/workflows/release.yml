name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build and publish Chrome & Firefox extension ZIPs

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build Firefox production
        run: |
          node scripts/check-cloud-permissions.js
          node node_modules/webpack-cli/bin/cli.js --config webpack.prod.js
          node node_modules/sass/sass.js --no-source-map sass:css
          mkdir -p firefox/js firefox/css
          cp -r images _locales view firefox/
          cp LICENSE firefox/LICENSE
          cp manifests/manifest-firefox.json firefox/manifest.json
          cp manifests/manifest-pwa.json firefox/manifest-pwa.json
          cp js/*.js js/*.LICENSE.txt firefox/js/
          cp css/*.css firefox/css/
          cp sass/mocha.css sass/DroidSansMono.woff2 firefox/css/
          test -z "$(find firefox -name '*.map' -print -quit)"

      - name: Package Firefox
        run: cd firefox && zip -r "../OTPilot-Authenticator-firefox-${GITHUB_REF_NAME}.zip" .

      - name: Build Chrome
        run: npm run chrome

      - name: Package Chrome
        run: cd chrome && zip -r "../OTPilot-Authenticator-chrome-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" "OTPilot-Authenticator-firefox-${GITHUB_REF_NAME}.zip" "OTPilot-Authenticator-chrome-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
